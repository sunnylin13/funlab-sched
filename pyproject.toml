[project]
name = "funlab-sched"
version = "0.3.5"
description = "A funlab-flaskr service plugin provide task scheduling, using APScheduler."
authors = [{ name = "sunny", email = "013.lin@gmail.com" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.10.1,<4",
    "flask-wtf>=1.2.1,<2",
    "funlab-flaskr",
]

[project.urls]
Repository = "https://github.com/sunnylin13/funlab-sched"

[project.optional-dependencies]
sse = ["funlab-sse"]

[project.entry-points."funlab_plugin"]
SchedService = "funlab.sched.service:SchedService"

[dependency-groups]
dev = ["pytest>=8.3.0,<10"]

[tool.uv.sources]
funlab-flaskr = { workspace = true }
funlab-sse = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["funlab"]

[tool.funlab_plugin_metadata.SchedService]
load_mode = "startup"
security_mode = "required"
optional_dependencies = ["SSEService"]
