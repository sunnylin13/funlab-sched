# B1a 遷移宣告（卡 t_786e5277，報告 §4-B1；裁決 D-261115-3）：A13 防呆甲：官方值倉每日比對（只報不寫）
# entry／trigger 逐字承自原 crontab（auto 盤點快照 exec.tz-asia-taipei-9.toml）；命令與行為零變化。
# legacy_ref＝切換後 crontab 行實際子串（inventory 錨＋missed.py hosted-exec 判式）。
id = "finstmt_selfcheck.daily"
owner = "dev-ops"
kind = "exec"
entry = "TZ=Asia/Taipei /home/sunnylin/workspaces/fund13/.deploy/finstmt_selfcheck.sh >> /home/sunnylin/workspaces/fund13/.deploy/logs/cron_finstmt_selfcheck.log 2>&1"
legacy_ref = "fund13-sched-run finstmt_selfcheck.daily"
trigger = { type = "cron", expr = "30 4 * * *", tz = "Asia/Taipei" }
timeout_sec = 1800
retry = { max = 1 }
alert = { channel = "log", dedupe_hours = 6 }
heartbeat = { max_silence_hours = 26 }
safety = { writes_db = false, idempotent = true }
enabled = true
